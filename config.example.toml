# burrow config example — run `burrow config set` to configure interactively
# or copy this file to ~/.config/burrow/config.toml and edit manually
#
# Override config path: export BURROW_CONFIG=/path/to/config.toml
# Any field can be set via environment variable (takes priority over file):
#   BURROW_USE_SSH
#   BURROW_SSH_HOST, BURROW_SSH_USER, BURROW_SSH_KEY_PATH, BURROW_SSH_PORT
#   BURROW_DB_HOST, BURROW_DB_PORT, BURROW_DB_USER, BURROW_DB_PASSWORD
#   BURROW_DB_NAME, BURROW_DB_SCHEMA, BURROW_TUNNEL_LOCAL_PORT, BURROW_CONNECTION_TIMEOUT
#   BURROW_ACCESS_MODE
#
# use_ssh defaults to true, so existing profiles without it continue to work.

# --- PostgreSQL over SSH tunnel ---
[default]
db_type      = "postgres"
use_ssh      = true
ssh_host     = "ssh.example.com"
ssh_user     = "sshuser"
ssh_key_path = "~/.ssh/id_rsa"
db_host      = "db.example.com"
db_user      = "appuser"
db_name      = "appdb"
db_schema    = "public"
access_mode  = "readwrite"

# Read-only profile (blocks INSERT/UPDATE/DELETE/DDL)
[readonly]
db_type      = "postgres"
use_ssh      = true
ssh_host     = "ssh.example.com"
ssh_user     = "sshuser"
ssh_key_path = "~/.ssh/id_rsa"
db_host      = "db-replica.example.com"
db_user      = "appuser"
db_name      = "appdb"
access_mode  = "read"

[staging]
db_type      = "postgres"
use_ssh      = true
ssh_host     = "ssh-staging.example.com"
ssh_user     = "sshuser"
ssh_key_path = "~/.ssh/id_rsa"
db_host      = "db-staging.example.com"
db_user      = "appuser"
db_name      = "appdb_staging"
db_schema    = "public"

# --- Direct connection (no SSH) ---
[local]
db_type      = "postgres"
use_ssh      = false
db_host      = "localhost"
db_user      = "appuser"
db_name      = "appdb"
